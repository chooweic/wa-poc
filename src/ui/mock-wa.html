<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chat simulator</title>
<style>
  :root {
    --page: #e9edf2; --panel: #ffffff; --chat: #f3efe8; --ink: #17202b; --muted: #68737f;
    --line: #d9dfe6; --bot: #ffffff; --me: #d6ebff; --accent: #1f6feb; --accent-ink: #ffffff; --danger: #b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #0d1117; --panel: #161b22; --chat: #0f141a; --ink: #e6edf3; --muted: #8b949e;
      --line: #2a313a; --bot: #1c232c; --me: #173a63; --accent: #4c9aff; --accent-ink: #0b1220; --danger: #ff7b72;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--page); color: var(--ink);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center;
  }
  .toolbar {
    width: 100%; max-width: 460px; padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  }
  .toolbar label { font-size: 12px; color: var(--muted); }
  select, input[type=text], textarea, button {
    font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  }
  select, input[type=text] { padding: 7px 9px; min-width: 0; }
  .toolbar select { flex: 1 1 180px; }
  .toolbar input[type=text] { flex: 1 1 140px; }
  button { padding: 7px 11px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  .toolbar a { color: var(--accent); font-size: 13px; text-decoration: none; margin-left: auto; white-space: nowrap; }
  .phone {
    width: 100%; max-width: 460px; flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column;
    background: var(--chat); border: 1px solid var(--line); border-radius: 18px 18px 0 0; overflow: hidden;
  }
  .head { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .avatar {
    width: 38px; height: 38px; border-radius: 50%; background: var(--accent); color: var(--accent-ink);
    display: grid; place-items: center; font-weight: 600;
  }
  .head .name { font-weight: 600; }
  .head .status { font-size: 12px; color: var(--muted); min-height: 17px; }
  .head .status.typing { color: var(--accent); }
  .msgs { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 6px; }
  .empty { margin: auto; text-align: center; color: var(--muted); font-size: 13px; max-width: 260px; }
  .day { align-self: center; font-size: 11px; color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; margin: 6px 0; }
  .b {
    max-width: 84%; padding: 7px 10px 5px; border-radius: 12px; background: var(--bot); border: 1px solid var(--line);
    align-self: flex-start; overflow-wrap: anywhere; box-shadow: 0 1px 0 rgba(0,0,0,.04);
  }
  .b.me { align-self: flex-end; background: var(--me); border-color: transparent; }
  .b .meta { display: block; text-align: right; font-size: 10.5px; color: var(--muted); margin-top: 2px; white-space: nowrap; }
  .b .ticks.read { color: var(--accent); }
  .b img { display: block; max-width: 100%; max-height: 240px; border-radius: 8px; margin-bottom: 4px; }
  .b .file { display: inline-flex; gap: 6px; align-items: center; color: inherit; text-decoration: none; padding: 4px 0; font-weight: 500; }
  .dots { align-self: flex-start; background: var(--bot); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: none; gap: 4px; }
  .dots.on { display: inline-flex; }
  .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite both; }
  .dots i:nth-child(2) { animation-delay: .2s; } .dots i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .dots i { animation: none; } }
  .attach { display: none; align-items: center; gap: 8px; padding: 6px 12px; font-size: 13px; background: var(--panel); border-top: 1px solid var(--line); }
  .attach.on { display: flex; }
  .attach span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .composer { display: flex; gap: 8px; align-items: flex-end; padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); background: var(--panel); border-top: 1px solid var(--line); }
  .composer textarea { flex: 1; resize: none; padding: 9px 11px; border-radius: 18px; max-height: 120px; min-height: 40px; }
  .icon { width: 40px; height: 40px; border-radius: 50%; padding: 0; display: grid; place-items: center; font-size: 18px; flex: none; }
  .send { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .send:disabled { opacity: .5; cursor: default; }
  .err { color: var(--danger); font-size: 12px; padding: 0 12px 6px; background: var(--panel); min-height: 0; }
  .sr { position: absolute; left: -9999px; }
</style>
</head>
<body>
  <div class="toolbar">
    <label for="who">You are</label>
    <select id="who" aria-label="Phone number to send as"></select>
    <input id="custom" type="text" inputmode="numeric" placeholder="Any number, e.g. 6591234567" hidden aria-label="Custom phone number">
    <button id="reset" type="button" title="Send /reset">/reset</button>
    <button id="cancel" type="button" title="Send /cancel">/cancel</button>
    <a href="/mock-app" target="mockapp">Open mock HR app ↗</a>
  </div>

  <div class="phone">
    <div class="head">
      <div class="avatar" aria-hidden="true">HR</div>
      <div>
        <div class="name">HR Assistant</div>
        <div class="status" id="status">online</div>
      </div>
    </div>
    <div class="msgs" id="msgs" aria-live="polite">
      <div class="empty" id="empty">Simulated chat. Say hello, or try “I was sick yesterday”.</div>
      <div class="dots" id="dots" aria-hidden="true"><i></i><i></i><i></i></div>
    </div>
    <div class="attach" id="attach"><span id="attachName"></span><button id="attachClear" type="button">Remove</button></div>
    <div class="err" id="err" role="alert"></div>
    <form class="composer" id="form">
      <input id="file" class="sr" type="file" accept="image/jpeg,image/png,application/pdf" tabindex="-1">
      <button class="icon" id="pick" type="button" title="Attach a photo or PDF" aria-label="Attach a photo or PDF">📎</button>
      <textarea id="text" rows="1" placeholder="Message" aria-label="Message"></textarea>
      <button class="icon send" id="send" type="submit" title="Send" aria-label="Send">➤</button>
    </form>
  </div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var who = $('who'), custom = $('custom'), msgs = $('msgs'), dots = $('dots'), empty = $('empty');
  var text = $('text'), file = $('file'), statusEl = $('status'), err = $('err');
  var phone = '', lastId = 0, lastDay = '', busy = false, timer = null;

  function store(key, value) {
    try { if (value === undefined) return localStorage.getItem(key); localStorage.setItem(key, value); } catch (e) { return null; }
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  // Minimal WhatsApp-style formatting: *bold*, _italic_, line breaks.
  function format(s) {
    return esc(s)
      .replace(/\*([^*\n]+)\*/g, '<strong>$1</strong>')
      .replace(/(^|[\s(])_([^_\n]+)_(?=$|[\s).,!?])/g, '$1<em>$2</em>')
      .replace(/\n/g, '<br>');
  }
  function digits(s) { return String(s || '').replace(/\D/g, ''); }
  function currentPhone() { return who.value === 'other' ? digits(custom.value) : who.value; }

  function clearChat() {
    Array.prototype.slice.call(msgs.querySelectorAll('.b, .day')).forEach(function (n) { n.remove(); });
    lastId = 0; lastDay = ''; empty.hidden = false; setTyping(false);
  }
  function setTyping(on) {
    dots.classList.toggle('on', on);
    statusEl.textContent = on ? 'typing…' : 'online';
    statusEl.classList.toggle('typing', on);
    var ticks = msgs.querySelectorAll('.b.me .ticks');
    for (var i = 0; i < ticks.length; i++) {
      var pending = on && i === ticks.length - 1;
      ticks[i].textContent = pending ? '✓' : '✓✓';
      ticks[i].classList.toggle('read', !pending);
    }
  }
  function addMessage(m) {
    empty.hidden = true;
    var when = new Date(m.created_at);
    var day = when.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' });
    if (day !== lastDay) {
      lastDay = day;
      var d = document.createElement('div'); d.className = 'day'; d.textContent = day; msgs.insertBefore(d, dots);
    }
    var b = document.createElement('div');
    b.className = 'b' + (m.direction === 'in' ? ' me' : '');
    var html = '';
    if (m.evidence_id && m.media_kind === 'image') {
      html += '<a href="/evidence/' + esc(m.evidence_id) + '" target="_blank" rel="noopener"><img alt="Sent photo" src="/evidence/' + esc(m.evidence_id) + '"></a>';
    } else if (m.media_kind) {
      var label = '📄 ' + esc(m.media_name || 'file');
      html += m.evidence_id
        ? '<a class="file" href="/evidence/' + esc(m.evidence_id) + '" target="_blank" rel="noopener">' + label + '</a><br>'
        : '<span class="file">' + label + '</span><br>';
    }
    html += format(m.body || '');
    var time = when.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
    html += '<span class="meta">' + esc(time) + (m.direction === 'in' ? ' <span class="ticks">✓</span>' : '') + '</span>';
    b.innerHTML = html;
    msgs.insertBefore(b, dots);
    lastId = Math.max(lastId, m.id);
  }
  function scrollDown() { msgs.scrollTop = msgs.scrollHeight; }

  function poll() {
    var p = phone;
    if (!p) return Promise.resolve();
    return fetch('/mock-wa/api/messages?phone=' + encodeURIComponent(p) + '&after=' + lastId, { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (data) {
        if (p !== phone) return;
        var nearBottom = msgs.scrollHeight - msgs.scrollTop - msgs.clientHeight < 120;
        data.messages.forEach(function (m) { if (m.id > lastId) addMessage(m); });
        setTyping(data.typing);
        if (data.messages.length || data.typing) { if (nearBottom) scrollDown(); }
        err.textContent = '';
      })
      .catch(function () { err.textContent = 'Connection problem. Retrying…'; });
  }
  function loop() {
    clearTimeout(timer);
    poll().then(function () { timer = setTimeout(loop, 1500); });
  }
  function switchPhone() {
    custom.hidden = who.value !== 'other';
    phone = currentPhone();
    store('mockwa.who', who.value); store('mockwa.custom', custom.value);
    clearChat();
    if (phone) loop();
  }

  function send(body, attachment) {
    if (busy) return;
    if (!phone) { err.textContent = 'Choose or type a phone number first.'; return; }
    if (!body && !attachment) return;
    busy = true; $('send').disabled = true; err.textContent = '';
    var form = new FormData();
    form.append('phone', phone); form.append('text', body);
    if (attachment) form.append('file', attachment);
    fetch('/mock-wa/api/send', { method: 'POST', body: form })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status)); }); })
      .then(function () { text.value = ''; text.style.height = ''; clearAttachment(); return poll(); })
      .then(scrollDown)
      .catch(function (e) { err.textContent = 'Could not send: ' + e.message; })
      .then(function () { busy = false; $('send').disabled = false; text.focus(); });
  }
  function clearAttachment() { file.value = ''; $('attach').classList.remove('on'); }

  $('form').addEventListener('submit', function (e) { e.preventDefault(); send(text.value.trim(), file.files[0] || null); });
  text.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('form').requestSubmit(); }
  });
  text.addEventListener('input', function () { text.style.height = 'auto'; text.style.height = Math.min(text.scrollHeight, 120) + 'px'; });
  $('pick').addEventListener('click', function () { file.click(); });
  file.addEventListener('change', function () {
    var f = file.files[0];
    $('attach').classList.toggle('on', !!f);
    $('attachName').textContent = f ? '📎 ' + f.name + ' (' + Math.max(1, Math.round(f.size / 1024)) + ' KB)' : '';
  });
  $('attachClear').addEventListener('click', clearAttachment);
  $('reset').addEventListener('click', function () { send('/reset', null); });
  $('cancel').addEventListener('click', function () { send('/cancel', null); });
  who.addEventListener('change', switchPhone);
  custom.addEventListener('change', switchPhone);

  fetch('/mock-wa/api/users', { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (data) {
      data.users.forEach(function (u) {
        var o = document.createElement('option'); o.value = u.phone_number; o.textContent = u.name + ' · ' + u.phone_number; who.appendChild(o);
      });
      var other = document.createElement('option'); other.value = 'other'; other.textContent = 'Other number…'; who.appendChild(other);
      var saved = store('mockwa.who');
      if (saved && who.querySelector('option[value="' + saved.replace(/"/g, '') + '"]')) who.value = saved;
      custom.value = store('mockwa.custom') || '';
      switchPhone();
    })
    .catch(function () { err.textContent = 'Could not load the user list.'; });
})();
</script>
</body>
</html>
