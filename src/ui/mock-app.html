<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mock target app</title>
<style>
  :root {
    --page: #f4f6f8; --panel: #ffffff; --ink: #17202b; --muted: #68737f; --line: #dde3ea; --accent: #1f6feb;
    --ok: #17794a; --ok-bg: #dff5e8; --warn: #8a5a00; --warn-bg: #fdefc8; --bad: #b42318; --bad-bg: #fde4e1; --code: #f1f4f7; --flash: #fff6c9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #0d1117; --panel: #161b22; --ink: #e6edf3; --muted: #8b949e; --line: #2a313a; --accent: #4c9aff;
      --ok: #56d364; --ok-bg: #12301f; --warn: #e3b341; --warn-bg: #3a2d08; --bad: #ff7b72; --bad-bg: #3d1513; --code: #0f141a; --flash: #3a3410;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; padding: 14px 16px; }
  h1 { font-size: 18px; margin: 0; }
  header .sub { color: var(--muted); font-size: 12px; }
  header nav { margin-left: auto; display: flex; gap: 14px; }
  a { color: var(--accent); text-decoration: none; }
  main { padding: 0 16px 32px; display: grid; gap: 16px; max-width: 1200px; margin: 0 auto; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  h2 { font-size: 14px; margin: 0; padding: 10px 14px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: baseline; }
  h2 small { color: var(--muted); font-weight: 400; }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 14px; border-bottom: 1px solid var(--line); vertical-align: top; white-space: nowrap; }
  td.wrap { white-space: normal; min-width: 180px; }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
  tr:last-child td { border-bottom: 0; }
  td.num { font-variant-numeric: tabular-nums; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .approved, .s2 { color: var(--ok); background: var(--ok-bg); }
  .pending_review { color: var(--warn); background: var(--warn-bg); }
  .s4, .s5 { color: var(--bad); background: var(--bad-bg); }
  .none { padding: 14px; color: var(--muted); }
  .log { border-bottom: 1px solid var(--line); }
  .log:last-child { border-bottom: 0; }
  .log summary { cursor: pointer; padding: 8px 14px; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
  .log summary code { font-size: 12px; }
  .log .time { color: var(--muted); font-size: 12px; margin-left: auto; }
  .payloads { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 10px; padding: 0 14px 12px; }
  .payloads h3 { margin: 0 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  pre { margin: 0; padding: 10px; background: var(--code); border-radius: 8px; overflow-x: auto; font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .flash { animation: flash 2.5s ease-out; }
  @keyframes flash { from { background: var(--flash); } to { background: transparent; } }
  @media (prefers-reduced-motion: reduce) { .flash { animation: none; } }
  .muted { color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Mock target app</h1>
  <span class="sub">Stands in for the real target application. Refreshes every 3 seconds. <span id="stamp"></span></span>
  <nav><a href="/mock-wa" target="mockwa">Mock WhatsApp ↗</a><a href="/admin">Admin</a></nav>
</header>
<main>
  <section><h2>Users and balances <small>keyed by phone number</small></h2><div class="scroll" id="users"></div></section>
  <section><h2>Leave records <small>created by API calls</small></h2><div class="scroll" id="records"></div></section>
  <section><h2>API call log <small>POST /mock-api/transactions, newest first</small></h2><div id="log"></div></section>
</main>
<script>
(function () {
  var seen = { users: {}, records: {}, log: {} }, first = true, last = '', openLogs = {};
  function esc(s) {
    return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function pretty(text) { try { return JSON.stringify(JSON.parse(text), null, 2); } catch (e) { return String(text); } }
  function when(iso) { var d = new Date(iso); return isNaN(d) ? esc(iso) : esc(d.toLocaleString()); }
  function flash(kind, key, signature) {
    var changed = !first && seen[kind][key] !== signature;
    seen[kind][key] = signature;
    return changed ? ' class="flash"' : '';
  }
  function renderUsers(users) {
    if (!users.length) return '<div class="none">No users. Add test users on Admin → Test users.</div>';
    return '<table><thead><tr><th>Phone number</th><th>Name</th><th>Medical leave left</th><th>Off days left</th><th>Unpaid days taken</th></tr></thead><tbody>' +
      users.map(function (u) {
        var sig = [u.sick_leave_balance, u.off_day_balance, u.unpaid_days_taken].join('|');
        return '<tr' + flash('users', u.phone_number, sig) + '><td><code>' + esc(u.phone_number) + '</code></td><td>' + esc(u.name) +
          '</td><td class="num">' + esc(u.sick_leave_balance) + '</td><td class="num">' + esc(u.off_day_balance) +
          '</td><td class="num">' + esc(u.unpaid_days_taken) + '</td></tr>';
      }).join('') + '</tbody></table>';
  }
  function renderRecords(records) {
    if (!records.length) return '<div class="none">No records yet. Submit a request from the chat and it appears here.</div>';
    return '<table><thead><tr><th>Reference</th><th>Phone number</th><th>Reason</th><th>Dates</th><th>Days</th><th>Status</th><th>User’s own words</th><th>Evidence</th><th>Created</th></tr></thead><tbody>' +
      records.map(function (r) {
        var details = {}; try { details = JSON.parse(r.details) || {}; } catch (e) {}
        var files = (details.evidence || []).map(function (e, i) {
          return '<a href="/evidence/' + encodeURIComponent(e.id) + '" target="_blank" rel="noopener">' + esc(e.type || 'file') + ' ' + (i + 1) + '</a>';
        }).join(', ') || '<span class="muted">none</span>';
        return '<tr' + flash('records', r.id, r.status) + '><td><code>' + esc(r.reference_no) + '</code></td><td><code>' + esc(r.phone_number) +
          '</code></td><td>' + esc(r.reason_label || r.reason_code) + ' <span class="muted">(' + esc(r.reason_code) + ')</span></td><td>' +
          esc(r.start_date) + (r.end_date && r.end_date !== r.start_date ? ' → ' + esc(r.end_date) : '') + '</td><td class="num">' + esc(r.days) +
          '</td><td><span class="pill ' + esc(r.status) + '">' + esc(String(r.status).replace(/_/g, ' ')) + '</span></td><td class="wrap">' +
          esc(r.user_wording) + '</td><td>' + files + '</td><td>' + when(r.created_at) + '</td></tr>';
      }).join('') + '</tbody></table>';
  }
  function renderLog(log) {
    if (!log.length) return '<div class="none">No API calls yet.</div>';
    return log.map(function (l) {
      var cls = 's' + String(l.status).charAt(0);
      return '<details class="log" data-id="' + esc(l.id) + '"' + (openLogs[l.id] ? ' open' : '') + '><summary' + flash('log', l.id, l.status) +
        '><span class="pill ' + cls + '">' + esc(l.status) + '</span><code>' + esc(l.method) + ' ' + esc(l.path) + '</code>' +
        '<span class="muted">idempotency key <code>' + esc(l.idempotency_key || 'none') + '</code></span><span class="time">' + when(l.ts) + '</span></summary>' +
        '<div class="payloads"><div><h3>Request</h3><pre>' + esc(pretty(l.request_json)) + '</pre></div><div><h3>Response</h3><pre>' +
        esc(pretty(l.response_json)) + '</pre></div></div></details>';
    }).join('');
  }
  function refresh() {
    fetch('/mock-app/api/state', { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
      .then(function (body) {
        document.getElementById('stamp').textContent = 'Last checked ' + new Date().toLocaleTimeString() + '.';
        if (body === last) return;
        last = body;
        var data = JSON.parse(body);
        Array.prototype.forEach.call(document.querySelectorAll('details.log'), function (d) { openLogs[d.getAttribute('data-id')] = d.open; });
        document.getElementById('users').innerHTML = renderUsers(data.users);
        document.getElementById('records').innerHTML = renderRecords(data.records);
        document.getElementById('log').innerHTML = renderLog(data.log);
        first = false;
      })
      .catch(function () { document.getElementById('stamp').textContent = 'Connection problem, retrying.'; })
      .then(function () { setTimeout(refresh, 3000); });
  }
  refresh();
})();
</script>
</body>
</html>
